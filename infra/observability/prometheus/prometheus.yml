global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'shydrie-api'
    static_configs:
      - targets: ['api:8000']

  - job_name: 'shydrie-worker'
    static_configs:
      - targets: ['worker:8001']

  - job_name: 'redis'
    static_configs:
      - targets: ['redis:6379']

  - job_name: 'minio'
    static_configs:
      - targets: ['minio:9000']
