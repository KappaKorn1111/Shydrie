apiVersion: apps/v1
kind: Deployment
metadata:
  name: shydrie-api
  namespace: shydrie
spec:
  replicas: 2
  selector:
    matchLabels:
      app: shydrie-api
  template:
    metadata:
      labels:
        app: shydrie-api
    spec:
      containers:
        - name: api
          image: ghcr.io/your-org/shydrie-api:latest
          ports:
            - containerPort: 8000
          env:
            - name: POSTGRES_DSN
              value: postgresql://postgres:postgres@postgres:5432/shydrie
            - name: REDIS_URL
              value: redis://redis:6379/0
            - name: JWT_SECRET
              value: changeme
---
apiVersion: v1
kind: Service
metadata:
  name: shydrie-api
  namespace: shydrie
spec:
  selector:
    app: shydrie-api
  ports:
    - port: 8000
      targetPort: 8000
